[project]
name = "bleu-js-test"
version = "0.1.0"
description = "A small Streamlit playground for testing the Bleu.js API"
requires-python = ">=3.11"
dependencies = [
    "bleu-js>=1.5.178",
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# App modules live at the repo root, not in a package.
pythonpath = ["."]
